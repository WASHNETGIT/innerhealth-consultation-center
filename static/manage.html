<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage booking | Inner Health</title><script src="https://cdn.tailwindcss.com"></script><style>
/* === LIQUID GLASS BUTTON SYSTEM === */
button, .btn-glass, [data-service], [data-time], [data-day]:not(:disabled), .filter-btn {
  position: relative;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
}
button:active:not(:disabled), .btn-glass:active, [data-service]:active, [data-time]:active, [data-day]:active:not(:disabled) {
  transform: translateY(1px) scale(0.98) !important;
}

/* Liquid Emerald Glass (Primary CTAs) */
.leaf, button.leaf, .btn-primary, [type="submit"]:not(.btn-cancel), #new-booking, #new-sale {
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.92) 0%, rgba(5, 150, 105, 0.88) 50%, rgba(4, 120, 87, 0.94) 100%) !important;
  backdrop-filter: blur(14px) saturate(190%) !important;
  -webkit-backdrop-filter: blur(14px) saturate(190%) !important;
  border: 1px solid rgba(167, 243, 208, 0.6) !important;
  border-top-color: rgba(255, 255, 255, 0.75) !important;
  border-bottom-color: rgba(4, 120, 87, 0.6) !important;
  box-shadow: 0 8px 24px -4px rgba(16, 185, 129, 0.42), 0 3px 8px -2px rgba(5, 150, 105, 0.25), inset 0 1px 2px 0 rgba(255, 255, 255, 0.75), inset 0 -1.5px 2px 0 rgba(0, 0, 0, 0.22) !important;
  color: #ffffff !important;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
}
.leaf:hover, button.leaf:hover, .btn-primary:hover, [type="submit"]:hover:not(.btn-cancel), #new-booking:hover, #new-sale:hover {
  transform: translateY(-2px) !important;
  background: linear-gradient(135deg, rgba(52, 211, 153, 0.96) 0%, rgba(16, 185, 129, 0.92) 50%, rgba(5, 150, 105, 0.96) 100%) !important;
  box-shadow: 0 14px 30px -4px rgba(16, 185, 129, 0.55), 0 6px 14px -2px rgba(5, 150, 105, 0.35), inset 0 1px 2.5px 0 rgba(255, 255, 255, 0.9), inset 0 -1.5px 2px 0 rgba(0, 0, 0, 0.25) !important;
}

/* Frosted Liquid Glass (Secondary / Light buttons & service cards) */
[data-service], [data-time], [data-day]:not(:disabled), .border.bg-white:not(input):not(textarea), #prev, #next, #back, #password-close, #booking-close, #sale-close {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.75) 0%, rgba(248, 250, 252, 0.45) 100%) !important;
  backdrop-filter: blur(12px) saturate(180%) !important;
  -webkit-backdrop-filter: blur(12px) saturate(180%) !important;
  border: 1px solid rgba(255, 255, 255, 0.8) !important;
  border-top-color: rgba(255, 255, 255, 0.95) !important;
  border-bottom-color: rgba(203, 213, 225, 0.5) !important;
  box-shadow: 0 4px 14px -2px rgba(0, 0, 0, 0.06), 0 2px 6px -1px rgba(0, 0, 0, 0.03), inset 0 1px 2px 0 rgba(255, 255, 255, 0.95), inset 0 -1px 1.5px 0 rgba(0, 0, 0, 0.04) !important;
}
[data-service]:hover, [data-time]:hover, [data-day]:hover:not(:disabled), #prev:hover, #next:hover, #back:hover {
  transform: translateY(-2px) !important;
  background: linear-gradient(135deg, rgba(240, 253, 244, 0.9) 0%, rgba(220, 252, 231, 0.6) 100%) !important;
  border-color: rgba(110, 231, 183, 0.8) !important;
  box-shadow: 0 10px 22px -3px rgba(16, 185, 129, 0.18), 0 4px 8px -2px rgba(16, 185, 129, 0.1), inset 0 1px 2px 0 rgba(255, 255, 255, 1) !important;
}

/* Nav / Dark Liquid Glass Buttons */
header nav button, header nav a, #password-open, #refresh {
  background: linear-gradient(135deg, rgba(51, 65, 85, 0.75) 0%, rgba(30, 41, 59, 0.85) 100%) !important;
  backdrop-filter: blur(12px) saturate(180%) !important;
  -webkit-backdrop-filter: blur(12px) saturate(180%) !important;
  border: 1px solid rgba(255, 255, 255, 0.25) !important;
  border-top-color: rgba(255, 255, 255, 0.45) !important;
  box-shadow: 0 6px 16px -2px rgba(0, 0, 0, 0.25), inset 0 1px 1.5px 0 rgba(255, 255, 255, 0.4), inset 0 -1px 2px 0 rgba(0, 0, 0, 0.25) !important;
}
header nav button:hover, header nav a:hover, #password-open:hover, #refresh:hover {
  transform: translateY(-1.5px) !important;
  background: linear-gradient(135deg, rgba(71, 85, 105, 0.85) 0%, rgba(51, 65, 85, 0.95) 100%) !important;
  border-color: rgba(255, 255, 255, 0.4) !important;
  box-shadow: 0 10px 22px -2px rgba(0, 0, 0, 0.35), inset 0 1px 2px 0 rgba(255, 255, 255, 0.5) !important;
}
</style>
</head><body class="bg-stone-50 min-h-screen grid place-items-center p-5"><main class="bg-white rounded-2xl shadow-sm border p-8 max-w-lg w-full"><img src="/static/logo.jpg" alt="Inner Health Consultation Hub" class="h-20 w-20 rounded-xl object-cover mb-4"><p class="text-emerald-800 text-xs font-bold tracking-widest">INNER HEALTH CONSULTATION CENTER</p><h1 class="text-3xl font-semibold mt-3">Your appointment</h1><div id="info" class="py-8 text-slate-500">Loading booking details…</div><a id="pay-deposit" class="hidden block text-center bg-emerald-800 text-white rounded-lg p-3">Pay R150 deposit online</a><p id="deposit-note" class="text-sm text-amber-800 mt-3"></p><div id="bank-transfer" class="hidden rounded-xl bg-emerald-50 border border-emerald-100 p-4 mt-4 text-sm"><b>Pay your non-refundable deposit by EFT</b><dl class="grid grid-cols-[auto_1fr] gap-x-3 gap-y-1 mt-3"><dt>Account name</dt><dd id="bank-name"></dd><dt>Bank</dt><dd id="bank-bank"></dd><dt>Account number</dt><dd id="bank-number"></dd><dt>Branch code</dt><dd id="bank-branch"></dd><dt>Account type</dt><dd id="bank-type"></dd><dt>Amount</dt><dd id="bank-amount"></dd><dt>Payment reference</dt><dd id="bank-reference" class="font-semibold"></dd></dl><p id="bank-warning" class="text-xs text-slate-600 mt-3"></p></div><div id="reschedule" class="hidden border-t pt-4 mt-4"><label class="block text-sm">Choose a new date<input id="new-date" type="date" class="border rounded-lg p-2 w-full mt-1"></label><div id="new-slots" class="flex flex-wrap gap-2 mt-3"></div><button id="save-time" class="hidden mt-3 bg-emerald-900 text-white rounded-lg p-3 w-full">Confirm new time</button></div><div class="flex gap-3 mt-4"><a id="ics" class="hidden flex-1 text-center border rounded-lg p-3">Add to calendar</a><button id="reschedule-open" class="hidden flex-1 bg-emerald-50 text-emerald-900 rounded-lg p-3">Reschedule</button><button id="cancel" class="hidden flex-1 bg-red-50 text-red-800 rounded-lg p-3">Cancel appointment</button></div><a href="/book" class="block mt-6 text-center text-emerald-800">Book another appointment</a></main><script>let token=location.pathname.split('/').pop();async function load(){let r=await fetch('/api/public/manage/'+token),b=await r.json();if(!r.ok){document.querySelector('#info').textContent=b.detail;return}document.querySelector('#info').innerHTML=`<div class="text-sm text-slate-500">Reference ${b.reference}</div><div class="text-xl text-slate-800 font-medium mt-2">${b.service}</div><div class="mt-2">${new Date(b.date+'T12:00').toLocaleDateString('en-ZA',{weekday:'long',day:'numeric',month:'long',year:'numeric'})} at ${b.start_time}</div><div class="mt-3 capitalize">Status: ${b.status.replaceAll('_',' ')}</div><div class="mt-2">Deposit: R${b.deposit_paid} / R${b.deposit_required} · Balance due: R${b.balance_due}</div>`;if(b.status==='pending_deposit'){if(b.payment_url){document.querySelector('#pay-deposit').href=b.payment_url;document.querySelector('#pay-deposit').classList.remove('hidden')}else if(b.bank_transfer){let x=b.bank_transfer;for(let [id,key] of [['bank-name','account_name'],['bank-bank','bank'],['bank-number','account_number'],['bank-branch','branch_code'],['bank-type','account_type'],['bank-amount','amount'],['bank-reference','reference']])document.querySelector('#'+id).textContent=id==='bank-amount'?'R'+x[key]:x[key]||'—';document.querySelector('#bank-warning').textContent=x.complete?'Your slot remains pending until the center verifies your transfer.':'Some EFT details are still being confirmed. Contact the center before transferring.';document.querySelector('#bank-transfer').classList.remove('hidden')}else{document.querySelector('#deposit-note').textContent='Contact the center to arrange your R150 deposit.'}}if(b.status==='pending_deposit')document.querySelector('#cancel').classList.remove('hidden');if(b.status==='confirmed'||b.status==='arriving_soon'){document.querySelector('#ics').href='/api/public/manage/'+token+'/calendar.ics';document.querySelector('#ics').classList.remove('hidden');document.querySelector('#cancel').classList.remove('hidden');document.querySelector('#reschedule-open').classList.remove('hidden')}}load();document.querySelector('#reschedule-open').onclick=()=>document.querySelector('#reschedule').classList.toggle('hidden');let chosen='';document.querySelector('#new-date').min=new Date().toISOString().slice(0,10);document.querySelector('#new-date').onchange=async e=>{chosen='';document.querySelector('#save-time').classList.add('hidden');let r=await fetch('/api/public/manage/'+token+'/slots?day='+e.target.value),d=await r.json();document.querySelector('#new-slots').innerHTML=d.slots.map(t=>`<button data-slot="${t}" class="border rounded-lg px-3 py-2">${t}</button>`).join('');document.querySelectorAll('[data-slot]').forEach(x=>x.onclick=()=>{chosen=x.dataset.slot;document.querySelectorAll('[data-slot]').forEach(a=>a.classList.remove('bg-emerald-100'));x.classList.add('bg-emerald-100');document.querySelector('#save-time').classList.remove('hidden')})};document.querySelector('#save-time').onclick=async()=>{let r=await fetch('/api/public/manage/'+token+'/reschedule',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:document.querySelector('#new-date').value,start_time:chosen})}),d=await r.json();if(!r.ok){alert(d.detail);return}load()};document.querySelector('#cancel').onclick=async()=>{if(confirm('Cancel this appointment? Any deposit already paid is non-refundable.')){let r=await fetch('/api/public/manage/'+token+'/cancel',{method:'POST'});if(r.ok)load()}}</script></body></html>
