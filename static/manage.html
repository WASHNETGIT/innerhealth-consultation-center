<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage booking | Inner Health</title><script src="https://cdn.tailwindcss.com"></script><style>
/* Clean Professional Clinical Styling */
button, .btn-action { transition: all 0.15s ease-in-out; }
.leaf, button.leaf, .btn-primary {
  background: #059669 !important;
  color: #ffffff !important;
  border: 1px solid #047857 !important;
  box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05) !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
}
.leaf:hover, button.leaf:hover, .btn-primary:hover {
  background: #047857 !important;
}
</style>
</head><body class="bg-stone-50 min-h-screen grid place-items-center p-5"><main class="bg-white rounded-2xl shadow-sm border p-8 max-w-lg w-full"><img src="/static/logo.jpg" alt="Inner Health Consultation Hub" class="h-20 w-20 rounded-xl object-cover mb-4"><p class="text-emerald-800 text-xs font-bold tracking-widest">INNER HEALTH CONSULTATION CENTER</p><h1 class="text-3xl font-semibold mt-3">Your appointment</h1><div id="info" class="py-8 text-slate-500">Loading booking details…</div><a id="pay-deposit" class="hidden block text-center bg-emerald-800 text-white rounded-lg p-3">Pay R150 deposit online</a><p id="deposit-note" class="text-sm text-amber-800 mt-3"></p><div id="bank-transfer" class="hidden rounded-xl bg-emerald-50 border border-emerald-100 p-4 mt-4 text-sm"><b>Pay your non-refundable deposit by EFT</b><dl class="grid grid-cols-[auto_1fr] gap-x-3 gap-y-1 mt-3"><dt>Account name</dt><dd id="bank-name"></dd><dt>Bank</dt><dd id="bank-bank"></dd><dt>Account number</dt><dd id="bank-number"></dd><dt>Branch code</dt><dd id="bank-branch"></dd><dt>Account type</dt><dd id="bank-type"></dd><dt>Amount</dt><dd id="bank-amount"></dd><dt>Payment reference</dt><dd id="bank-reference" class="font-semibold"></dd></dl><p id="bank-warning" class="text-xs text-slate-600 mt-3"></p></div><div id="reschedule" class="hidden border-t pt-4 mt-4"><label class="block text-sm">Choose a new date<input id="new-date" type="date" class="border rounded-lg p-2 w-full mt-1"></label><div id="new-slots" class="flex flex-wrap gap-2 mt-3"></div><button id="save-time" class="hidden mt-3 bg-emerald-900 text-white rounded-lg p-3 w-full">Confirm new time</button></div><div class="flex gap-3 mt-4"><a id="ics" class="hidden flex-1 text-center border rounded-lg p-3">Add to calendar</a><button id="reschedule-open" class="hidden flex-1 bg-emerald-50 text-emerald-900 rounded-lg p-3">Reschedule</button><button id="cancel" class="hidden flex-1 bg-red-50 text-red-800 rounded-lg p-3">Cancel appointment</button></div><a href="/book" class="block mt-6 text-center text-emerald-800">Book another appointment</a></main><script>let token=location.pathname.split('/').pop();async function load(){let r=await fetch('/api/public/manage/'+token),b=await r.json();if(!r.ok){document.querySelector('#info').textContent=b.detail;return}document.querySelector('#info').innerHTML=`<div class="text-sm text-slate-500">Reference ${b.reference}</div><div class="text-xl text-slate-800 font-medium mt-2">${b.service}</div><div class="mt-2">${new Date(b.date+'T12:00').toLocaleDateString('en-ZA',{weekday:'long',day:'numeric',month:'long',year:'numeric'})} at ${b.start_time}</div><div class="mt-3 capitalize">Status: ${b.status.replaceAll('_',' ')}</div><div class="mt-2">Deposit: R${b.deposit_paid} / R${b.deposit_required} · Balance due: R${b.balance_due}</div><div class="mt-4 pt-3 border-t text-xs text-slate-600"><div class="font-semibold text-slate-800 flex items-center gap-1">📍 Consultation Address:</div><div class="mt-1 text-slate-700 font-medium">${b.address || "202 Robert Sobukwe Street, Esselen Towers, Sunnyside, Pretoria, 0002"}</div></div>`;if(b.status==='pending_deposit'){if(b.payment_url){document.querySelector('#pay-deposit').href=b.payment_url;document.querySelector('#pay-deposit').classList.remove('hidden')}else if(b.bank_transfer){let x=b.bank_transfer;for(let [id,key] of [['bank-name','account_name'],['bank-bank','bank'],['bank-number','account_number'],['bank-branch','branch_code'],['bank-type','account_type'],['bank-amount','amount'],['bank-reference','reference']])document.querySelector('#'+id).textContent=id==='bank-amount'?'R'+x[key]:x[key]||'—';document.querySelector('#bank-warning').textContent=x.complete?'Your slot remains pending until the center verifies your transfer.':'Some EFT details are still being confirmed. Contact the center before transferring.';document.querySelector('#bank-transfer').classList.remove('hidden')}else{document.querySelector('#deposit-note').textContent='Contact the center to arrange your R150 deposit.'}}if(b.status==='pending_deposit')document.querySelector('#cancel').classList.remove('hidden');if(b.status==='confirmed'||b.status==='arriving_soon'){document.querySelector('#ics').href='/api/public/manage/'+token+'/calendar.ics';document.querySelector('#ics').classList.remove('hidden');document.querySelector('#cancel').classList.remove('hidden');document.querySelector('#reschedule-open').classList.remove('hidden')}}load();document.querySelector('#reschedule-open').onclick=()=>document.querySelector('#reschedule').classList.toggle('hidden');let chosen='';document.querySelector('#new-date').min=new Date().toISOString().slice(0,10);document.querySelector('#new-date').onchange=async e=>{chosen='';document.querySelector('#save-time').classList.add('hidden');let r=await fetch('/api/public/manage/'+token+'/slots?day='+e.target.value),d=await r.json();document.querySelector('#new-slots').innerHTML=d.slots.map(t=>`<button data-slot="${t}" class="border rounded-lg px-3 py-2">${t}</button>`).join('');document.querySelectorAll('[data-slot]').forEach(x=>x.onclick=()=>{chosen=x.dataset.slot;document.querySelectorAll('[data-slot]').forEach(a=>a.classList.remove('bg-emerald-100'));x.classList.add('bg-emerald-100');document.querySelector('#save-time').classList.remove('hidden')})};document.querySelector('#save-time').onclick=async()=>{let r=await fetch('/api/public/manage/'+token+'/reschedule',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:document.querySelector('#new-date').value,start_time:chosen})}),d=await r.json();if(!r.ok){alert(d.detail);return}load()};document.querySelector('#cancel').onclick=async()=>{if(confirm('Cancel this appointment? Any deposit already paid is non-refundable.')){let r=await fetch('/api/public/manage/'+token+'/cancel',{method:'POST'});if(r.ok)load()}}</script></body></html>
