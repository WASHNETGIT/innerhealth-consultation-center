<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking admin | Inner Health</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-stone-50 text-slate-800"><header class="bg-emerald-950 text-white"><div class="max-w-6xl mx-auto px-5 py-5 flex justify-between"><a href="/" class="flex items-center gap-3"><img src="/static/logo.jpg" alt="Inner Health Consultation Hub" class="h-12 w-12 rounded-lg object-cover"><span class="font-semibold">INNER HEALTH CONSULTATION CENTER</span></a><span>Booking administration</span></div></header><main class="max-w-6xl mx-auto p-5 md:p-8"><div class="flex flex-wrap justify-between gap-4 items-end"><div><p class="text-emerald-800 text-xs font-bold tracking-widest">CONTROL CENTER</p><h1 class="text-3xl font-semibold mt-2">Appointments</h1></div><div class="flex gap-2"><input id="from" type="date" class="border rounded-lg p-2"><input id="to" type="date" class="border rounded-lg p-2"><button id="reload" class="bg-emerald-900 text-white rounded-lg px-4">Refresh</button></div></div><section class="bg-white border rounded-xl mt-6 overflow-auto"><table class="w-full text-sm"><thead class="bg-stone-100 text-left"><tr><th class="p-3">Date & time</th><th class="p-3">Client</th><th class="p-3">Service</th><th class="p-3">Status</th><th class="p-3">Update</th></tr></thead><tbody id="rows"></tbody></table></section><h2 class="text-xl font-semibold mt-10">Services</h2><div id="services" class="grid md:grid-cols-3 gap-3 mt-3"></div><form id="new-service" class="bg-white border rounded-xl p-4 mt-3 grid sm:grid-cols-5 gap-2"><input name="name" placeholder="Service name" required class="border rounded p-2"><input name="duration_minutes" type="number" value="60" placeholder="Minutes" class="border rounded p-2"><input name="price" type="number" step="0.01" placeholder="Price (R)" class="border rounded p-2"><input name="deposit" type="number" step="0.01" value="150" placeholder="Deposit (R)" class="border rounded p-2"><input name="description" placeholder="Description" class="border rounded p-2"><button class="bg-emerald-900 text-white rounded p-2">Add service</button></form><h2 class="text-xl font-semibold mt-10">Weekly availability</h2><div id="availability" class="grid gap-2 mt-3"></div><h2 class="text-xl font-semibold mt-10">Blocked dates</h2><form id="block-form" class="flex gap-2 mt-3"><input name="date" type="date" required class="border rounded p-2"><input name="reason" placeholder="Reason" class="border rounded p-2"><button class="bg-emerald-900 text-white rounded px-4">Block date</button></form><div id="blocked" class="mt-3 space-y-2"></div><p id="error" class="text-red-700 mt-5"></p></main><script>
const $=s=>document.querySelector(s);let auth=sessionStorage.getItem('ihcc_auth')||'';async function api(path,opt={}){let headers={'Content-Type':'application/json'};if(auth)headers.Authorization='Basic '+auth;let r=await fetch(path,{headers,...opt});if(r.status===401){let user=prompt('Admin username');if(user===null)throw Error('Admin sign in cancelled');let pass=prompt('Admin password');if(pass===null)throw Error('Admin sign in cancelled');auth=btoa(user+':'+pass);sessionStorage.setItem('ihcc_auth',auth);return api(path,opt)}let d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}async function load(){try{let q=new URLSearchParams();if($('#from').value)q.set('from_date',$('#from').value);if($('#to').value)q.set('to_date',$('#to').value);let [bs,ss,av,blocked]=await Promise.all([api('/api/admin/bookings?'+q),api('/api/admin/booking-services'),api('/api/admin/availability'),api('/api/admin/blocked-dates')]);$('#rows').innerHTML=bs.map(b=>`<tr class="border-t"><td class="p-3 whitespace-nowrap">${b.date} · ${b.start_time}–${b.end_time}</td><td class="p-3">${b.client}<div class="text-xs text-slate-500">${b.email||''} ${b.phone||''}</div></td><td class="p-3">${b.service}</td><td class="p-3 capitalize">${b.status}</td><td class="p-3"><select data-status="${b.id}" class="border rounded p-2"><option>confirmed</option><option>pending</option><option>completed</option><option>cancelled</option><option>no_show</option></select></td></tr>`).join('')||'<tr><td class="p-4" colspan="5">No bookings in this date range.</td></tr>';document.querySelectorAll('[data-status]').forEach(s=>{s.value=bs.find(b=>b.id==s.dataset.status).status;s.onchange=async()=>{await api('/api/admin/bookings/'+s.dataset.status,{method:'PATCH',body:JSON.stringify({status:s.value})});load()}});$('#services').innerHTML=ss.map(s=>`<article class="bg-white border rounded-xl p-4"><div class="flex justify-between"><b>${s.name}</b><span>${new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR'}).format(s.price)}</span></div><p class="text-sm text-slate-500 mt-2">${s.description}</p><div class="text-xs mt-2">${s.duration_minutes} minutes · Deposit R${s.deposit} · ${s.is_active?'Active':'Hidden'}</div><button data-edit="${s.id}" class="text-emerald-800 text-sm mt-3">Edit service</button></article>`).join('');document.querySelectorAll('[data-edit]').forEach(x=>x.onclick=async()=>{let s=ss.find(s=>s.id==x.dataset.edit);let name=prompt('Service name',s.name);if(name===null)return;let duration_minutes=Number(prompt('Duration in minutes',s.duration_minutes)||s.duration_minutes);let price=Number(prompt('Price in ZAR',s.price)||s.price);let deposit=Number(prompt('Deposit in ZAR',s.deposit)||s.deposit);let description=prompt('Description',s.description)||'';let is_active=confirm('Keep service active?');await api('/api/admin/booking-services/'+s.id,{method:'PUT',body:JSON.stringify({name,duration_minutes,price,deposit,description,is_active})});load()});let days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];$('#availability').innerHTML=av.map(a=>`<div class="bg-white border rounded-lg p-3 flex flex-wrap items-center gap-3"><b class="w-24">${days[a.day_of_week]}</b><label><input data-work="${a.day_of_week}" type="checkbox" ${a.is_working_day?'checked':''}> Working</label><input data-start="${a.day_of_week}" type="time" value="${a.start_time}" class="border rounded p-1"><span>to</span><input data-end="${a.day_of_week}" type="time" value="${a.end_time}" class="border rounded p-1"><button data-save="${a.day_of_week}" class="text-emerald-800">Save</button></div>`).join('');document.querySelectorAll('[data-save]').forEach(x=>x.onclick=async()=>{let i=x.dataset.save;await api('/api/admin/availability/'+i,{method:'PUT',body:JSON.stringify({is_working_day:$(`[data-work="${i}"]`).checked,start_time:$(`[data-start="${i}"]`).value,end_time:$(`[data-end="${i}"]`).value})});load()});$('#blocked').innerHTML=blocked.map(b=>`<div class="flex gap-3 bg-white border rounded p-3"><span>${b.date} · ${b.reason||'Unavailable'}</span><button data-unblock="${b.id}" class="text-red-700">Remove</button></div>`).join('');document.querySelectorAll('[data-unblock]').forEach(x=>x.onclick=async()=>{await api('/api/admin/blocked-dates/'+x.dataset.unblock,{method:'DELETE'});load()})}catch(e){$('#error').textContent=e.message}}
$('#reload').onclick=load;$('#new-service').onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(e.target));b.duration_minutes=Number(b.duration_minutes);b.price=Number(b.price);b.deposit=Number(b.deposit);await api('/api/admin/booking-services',{method:'POST',body:JSON.stringify(b)});e.target.reset();load()};$('#block-form').onsubmit=async e=>{e.preventDefault();await api('/api/admin/blocked-dates',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();load()};load();</script></body></html>
